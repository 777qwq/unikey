name: Build CC Tile

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
          mkdir -p $HOME/theos/sdks
          ln -s "$(xcrun --sdk iphoneos --show-sdk-path)" $HOME/theos/sdks/iphoneos.sdk
          GITHUB_TOKEN=${{ github.token }} bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          git clone --depth 1 https://github.com/theos/dm.pl /tmp/dm.pl
          cp /tmp/dm.pl/dm.pl $HOME/theos/bin/dm.pl && chmod +x $HOME/theos/bin/dm.pl
          sed -i '' 's/convert binary1/convert xml1/' $HOME/theos/bin/convert_xml_plist.sh
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Show Xcode SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          echo "SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)" >> $GITHUB_ENV

      - name: Build genfilter tool
        run: |
          xcrun -sdk $(xcrun --sdk iphoneos --show-sdk-path) clang -arch arm64 -fobjc-arc -framework Foundation genfilter.mm -o unikeygenfilter
          LDID=$(find $HOME/theos /usr/local /opt/homebrew -name "ldid" -type f 2>/dev/null | head -1)
          echo "ldid found: $LDID"
          if [ -n "$LDID" ]; then $LDID -S unikeygenfilter; else brew install ldid && ldid -S unikeygenfilter; fi
          mkdir -p layout/usr/bin
          cp unikeygenfilter layout/usr/bin/

      - name: Fix maintainer script permissions
        run: |
          chmod +x layout/DEBIAN/postinst 2>/dev/null || true

      - name: Build package
        run: make package FINALPACKAGE=1
        env:
          THEOS_PACKAGE_SCHEME: rootless

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: unikey-deb
          path: packages/*.deb

